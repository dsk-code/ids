services:
  db:
    container_name: kids_mng_db
    image: postgres:latest
    restart: always
    ports: 
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kids_mng_db
    volumes:
      - kids-mng-data:/var/lib/postgresql/data
    profiles:
      - production

  test_db:
    container_name: kids_mng_test_db
    image: postgres:latest
    restart: always
    ports: 
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    profiles:
      - test

volumes:
  kids-mng-data: