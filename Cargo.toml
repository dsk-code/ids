[workspace]
members = [ 
    "backend/auth", 
    "backend/database",
    "backend/server",
    "backend/shared",
]

resolver = "2"

[workspace.package]
name = "ids"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"

[workspace.dependencies]
axum-extra = {version = "0.10.0", features = ["typed-header"]}
uuid = {version = "1.11.0", features = ["v4", "serde"]}
axum = "0.8.1"
axum-macros = "0.5.0"
shuttle-axum = "0.51.0"
shuttle-runtime = "0.51.0"
shuttle-shared-db = { version = "0.51.0", features = ["postgres", "sqlx"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono"] }
tower-http = {version = "0.6.2", features = ["fs", "cors"]}
thiserror = "2.0.11"
anyhow = "1.0.86"
serde = {version = "1.0.0", features = ["derive"]}
derive-new = "0.6.0"
fake = "2.9.2"
jsonwebtoken = "9.3.0"
chrono  = "0.4.37"
reqwest = { version = "0.12.7", features = ["json"] }
tokio = {version = "1.39.3", features = ["full"]}
dotenvy = "0.15.7"
envy = "0.4.2"
url = "2.5.2"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
# test
test-auth0 = {git = "https://github.com/dsk-code/test-auth0.git", rev = "671fa25c98a8e0ce9da6d651b48aa4d895441649"}