[workspace]
members = [ 
    "backend/auth", 
    "backend/database",
    "backend/server",
    "backend/shared",
]

resolver = "2"

[workspace.package]
name = "ids"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"

[workspace.dependencies]
axum-extra = "0.9.6"
uuid = {version = "1.11.0", features = ["v4", "serde"]}
