[env]
TEST_DATABASE_URL="postgres://postgres:postgres@localhost:5434/postgres"

[config]
default_to_workspace = false

# ******************* backend *******************
[tasks.fmt]
command = "cargo"
args = ["fmt"]

[tasks.clippy]
command = "cargo"
args = ["clippy"]

[tasks.db_up]
command = "docker"
args = [ "compose", "up", "-d", "db" ]

[tasks.db_down]
command = "docker"
args = [ "compose", "down", "db" ]

[tasks.run]
command = "cargo"
dependencies = ["db_up"]
args = [ "run", "-p", "ids_server" ]


# ******************* frontend *******************
[tasks.front_dev]
description = "Run 'pnpm run dev' in the frontend directory"
command = "pnpm"
args = ["run", "dev"]
cwd = "./frontend"

[tasks.front_build]
description = "Run 'pnpm run build' in the frontend directory"
command = "pnpm"
args = ["run", "build"]
cwd = "./frontend"

[tasks.front_preview]
description = "Run 'pnpm run preview' in the frontend directory"
command = "pnpm"
args = ["run", "preview"]
cwd = "./frontend"

# ******************* backend test *******************
[tasks.test_db_up]
command = "docker"
args = [ "compose", "up", "-d", "test_db" ]

[tasks.test]
description = "Run tests"
dependencies = ["test_db_up", "clippy", "fmt"]
command = "cargo"
args = ["test", "${@}"]

[tasks.test_db_down]
command = "docker"
args = [ "compose", "rm", "-fsv", "test_db" ]

[tasks.test_flow]
description = "test用のdbを開きテストしてテスト用dbを削除します。testの引数を渡せます。"
dependencies = ["test", "test_db_down"]


# ******************* sqlx-cli *******************
# https://github.com/launchbadge/sqlx/blob/main/sqlx-cli/README.md#enable-building-in-offline-mode-with-query
[tasks.sqlx_cli_install]
command = "cargo"
args = ["install", "sqlx-cli", "--no-default-features", "--features", "native-tls,postgres"]

[tasks.sqlx_migrate_add]
# `cargo make sqlx-migrate-add <file_name>`
description = "Adding migration files for 'up' and 'down'"
command = "sqlx"
args = ["migrate", "add", "-r", "--source", "./backend/database/migrations", "${@}"]

[tasks.sqlx_migrate_run]
command = "sqlx"
args = ["migrate", "run", "--source", "./backend/database/migrations"]

[tasks.sqlx_migrate_revert]
# (注)ロールバック
command = "sqlx"
args = ["migrate", "revert", "--source", "./backend/database/migrations"]

